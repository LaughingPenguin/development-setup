set -g prefix C-Space
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000
set -g set-clipboard on
set -g copy-command "pbcopy"
set -g focus-events on

unbind C-b
bind C-Space send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fast copy-mode entry
bind -n M-k copy-mode \; send-keys -X halfpage-up
bind -n M-j copy-mode \; send-keys -X halfpage-down-and-cancel

# Sticky per-pane copy mark
bind -T copy-mode-vi m run-shell -b \
	"tmux set-option -p -t '#{pane_id}' @copy_mark '#{e|+:#{e|-:#{history_size},#{copy_position}},#{copy_cursor_y}}'; tmux set-option -p -t '#{pane_id}' @copy_mark_x '#{copy_cursor_x}'" \; \
	display-message "Mark set"

bind -T copy-mode-vi "'" if-shell -F "#{@copy_mark}" \
	'run-shell -b "tmux send-keys -t #{pane_id} -X goto-line #{e|+:#{e|-:#{history_size},#{@copy_mark}},#{e|-:#{pane_height},1}}; tmux send-keys -t #{pane_id} -X scroll-middle"' \
	"display-message 'No copy mark set'"

bind -n "M-'" if-shell -F "#{@copy_mark}" \
	'run-shell -b "tmux copy-mode -t #{pane_id}; tmux send-keys -t #{pane_id} -X goto-line #{e|+:#{e|-:#{history_size},#{@copy_mark}},#{e|-:#{pane_height},1}}; tmux send-keys -t #{pane_id} -X scroll-middle"' \
	"display-message 'No copy mark set'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Official TPM bootstrap
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

run '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1'
run '~/.tmux/plugins/tpm/tpm'
